# Weekly update pull requests. Minor and patch updates arrive grouped in one
# pull request per directory; each major update arrives on its own, so it can
# be proven alone (quote and invoice proof, email HTML) before it merges.
# Titles start with "chore:", the typed title CONTRIBUTING.md asks for.
# SECURITY.md ("Dependency Advisories") records the advisories accepted for now.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Adelaide
    commit-message:
      prefix: chore
    open-pull-requests-limit: 3
    groups:
      server-minor-and-patch:
        update-types: [minor, patch]
    # Held updates. Recheck each by its date.
    ignore:
      # pdfkit 0.18 and later add /UserUnit to every page, so issued quotes and
      # invoices are no longer byte-identical (proof 11/25). Take it only with
      # a deliberate re-baseline of the quote and invoice proof. Recheck 2027-01-13.
      - dependency-name: pdfkit
        versions: [">=0.18.0"]
      # The types follow the runtime: Node 24 on Replit, in Docker and in CI.
      # @types/node 26 declares APIs that Node 24 lacks. Recheck when the
      # runtime moves to Node 26, or on 2027-01-13.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @sentry/node 11 collects headers, cookies, bodies and IP addresses by
      # default and skips beforeSendTransaction (#129). Recheck 2027-01-13.
      - dependency-name: "@sentry/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Adelaide
    commit-message:
      prefix: chore
    open-pull-requests-limit: 3
    groups:
      client-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # As for the server: the types follow the Node 24 runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @sentry/react moves to 11 with the server (#129). Recheck 2027-01-13.
      - dependency-name: "@sentry/react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Adelaide
    commit-message:
      prefix: chore
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Adelaide
    commit-message:
      prefix: chore
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
