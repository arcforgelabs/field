name: Release promote
run-name: Promote ${{ inputs.tag }} to stable

# Makes a published stable release the one operators get by default
# (docs/RELEASING.md): npm `latest`, GHCR `stable` and `latest`, and GitHub's
# latest release. It first verifies the release as published: the manifest's
# checksum, the npm integrity, registry signatures and provenance, and the
# image's GitHub attestation by digest. To roll back, promote an earlier
# stable tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable tag, for example v2026.10.14
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-promote
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  NPM_VERSION: "11.21.0"
  PACKAGE: "@arcforgelabs/field"
  IMAGE: ghcr.io/arcforgelabs/field

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.manifest.outputs.version }}
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Require the workflow from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run Release promote from main, not ${GITHUB_REF}." >&2
          exit 1

      - name: Read and check the release manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v20[0-9]{2}\.[1-9][0-9]?\.[1-9][0-9]?$ ]]; then
            echo "::error::${TAG} is not a stable release tag (vYYYY.M.D). Betas are never promoted; cut a stable tag from the same commit." >&2
            exit 1
          fi
          cd "$RUNNER_TEMP"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'release-manifest.json*'
          sha256sum -c release-manifest.json.sha256
          jq -e --arg tag "$TAG" '.tag == $tag and .channel == "stable"' release-manifest.json >/dev/null
          {
            echo "version=$(jq -r .version release-manifest.json)"
            echo "digest=$(jq -r .image.digest release-manifest.json)"
            echo "integrity=$(jq -r .npm.integrity release-manifest.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm ${{ env.NPM_VERSION }}
        run: npm install -g "npm@${NPM_VERSION}"

      - name: Verify the npm package
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
          INTEGRITY: ${{ steps.manifest.outputs.integrity }}
        run: |
          set -euo pipefail
          served="$(npm view "${PACKAGE}@${VERSION}" dist.integrity)"
          if [[ "$served" != "$INTEGRITY" ]]; then
            echo "::error::npm serves ${served} for ${PACKAGE}@${VERSION}; the manifest says ${INTEGRITY}." >&2
            exit 1
          fi
          npm view "${PACKAGE}@${VERSION}" dist.attestations.provenance.predicateType | grep -qx 'https://slsa.dev/provenance/v1'
          work="$(mktemp -d)"
          cd "$work"
          npm init -y >/dev/null
          npm install --omit=dev --ignore-scripts --no-audit --no-fund "${PACKAGE}@${VERSION}" >/dev/null
          npm audit signatures

      - name: Verify the image attestation by digest
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$GITHUB_REPOSITORY"

  promote:
    name: promote
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm-release
      url: https://github.com/arcforgelabs/field/releases/tag/${{ inputs.tag }}
    permissions:
      contents: write
      packages: write
      # npm dist-tag through trusted publishing (npm 11.21.0 or later, with
      # "Allow npm dist-tag" on this workflow's trusted publisher).
      id-token: write
    steps:
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm ${{ env.NPM_VERSION }}
        run: npm install -g "npm@${NPM_VERSION}"

      - name: Move npm latest
        id: npm
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          npm dist-tag add "${PACKAGE}@${VERSION}" latest
          # Beta users are never behind stable: when `beta` is this release's
          # own pre-release or an older one, it moves up to this release.
          beta="$(npm view "$PACKAGE" dist-tags.beta 2>/dev/null || true)"
          beta_base="${beta%%-*}"
          lowest="$(printf '%s\n%s\n' "$beta_base" "$VERSION" | sort -V | head -n1)"
          if [[ -z "$beta" || "$lowest" == "$beta_base" ]]; then
            npm dist-tag add "${PACKAGE}@${VERSION}" beta
            echo "beta=true" >> "$GITHUB_OUTPUT"
          fi
          npm view "$PACKAGE" dist-tags --json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Move GHCR stable and latest to the verified digest
        env:
          DIGEST: ${{ needs.verify.outputs.digest }}
          MOVE_BETA: ${{ steps.npm.outputs.beta }}
        run: |
          set -euo pipefail
          tags=(--tag "${IMAGE}:stable" --tag "${IMAGE}:latest")
          [[ "$MOVE_BETA" == "true" ]] && tags+=(--tag "${IMAGE}:beta")
          docker buildx imagetools create "${tags[@]}" "${IMAGE}@${DIGEST}"
          echo "${tags[*]} -> ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Mark the GitHub Release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
