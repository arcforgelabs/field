# Public-repo copy of arcforgelabs/.github@a115c8f8dc02978d8c82c9554f02ea8e013a6981; trusted base checkout only.
# Port of vendor/openclaw/.github/workflows/labeler.yml; adaptations documented in README.
# Field: the size label also leaves out package-lock.json, client/package-lock.json and e2e/package-lock.json.
name: Labeler

on:
  pull_request_target: # Trusted reusable workflow only; never executes PR code.
    types: [opened, synchronize, reopened, edited]
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      max_prs:
        description: "Maximum open PRs to backfill (0 = all)"
        default: "200"
      per_page:
        description: "PRs per page (1-100)"
        default: "50"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  LABELER_MAX_PRS: ${{ inputs.max_prs || '200' }}
  LABELER_PER_PAGE: ${{ inputs.per_page || '50' }}

permissions: {}

jobs:
  label:
    if: >-
      ${{ (
        github.event_name == 'pull_request_target' &&
        (
          github.event.action != 'edited' ||
          github.event.changes.title ||
          github.event.changes.base
        )
      ) }}
    concurrency:
      group: labeler-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          app-id: ${{ vars.BARNACLE_APP_ID }}
          private-key: ${{ secrets.BARNACLE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: write
          permission-members: read
          permission-metadata: read
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      # Read only the caller's trusted base config as data. Never checkout PR code.
      - name: Load optional area map
        id: area-map
        if: ${{ github.event.action != 'edited' || github.event.changes.base }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            try {
              const { data } = await github.rest.repos.getContent({
                ...context.repo, path: ".github/labeler.yml", ref: context.sha,
              });
              if (data.type !== "file" || data.encoding !== "base64") {
                throw new Error("Area map must be a regular file");
              }
              require("node:fs").writeFileSync(".caller-labeler.yml", Buffer.from(data.content, "base64"));
              core.setOutput("exists", "true");
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info("No area map; size, maintainer and beta-blocker labels remain enabled.");
              core.setOutput("exists", "false");
            }
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        if: ${{ steps.area-map.outputs.exists == 'true' }}
        with:
          configuration-path: .caller-labeler.yml
          repo-token: ${{ steps.app-token.outputs.token }}
          sync-labels: true
      - name: Apply PR size label
        if: ${{ github.event.action != 'edited' || github.event.changes.base }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const pullRequest = context.payload.pull_request;
            if (!pullRequest) {
              return;
            }

            const { pathToFileURL } = require("node:url");
            const { addLabelsWithinCap } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/automation/labeler-label-cap.mjs`).href
            );

            const sizeLabels = ["size: XS", "size: S", "size: M", "size: L", "size: XL"];
            const labelColor = "b76e79";

            for (const label of sizeLabels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                });
              } catch (error) {
                if (error?.status !== 404) {
                  throw error;
                }
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: labelColor,
                });
              }
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });

            const excludedLockfiles = new Set(["package-lock.json", "client/package-lock.json", "e2e/package-lock.json", "pnpm-lock.yaml", "yarn.lock", "bun.lockb"]);
            const totalChangedLines = files.reduce((total, file) => {
              const path = file.filename ?? "";
              if (path.startsWith("docs/") || excludedLockfiles.has(path)) {
                return total;
              }
              return total + (file.additions ?? 0) + (file.deletions ?? 0);
            }, 0);

            let targetSizeLabel = "size: XL";
            if (totalChangedLines < 50) {
              targetSizeLabel = "size: XS";
            } else if (totalChangedLines < 200) {
              targetSizeLabel = "size: S";
            } else if (totalChangedLines < 500) {
              targetSizeLabel = "size: M";
            } else if (totalChangedLines < 1000) {
              targetSizeLabel = "size: L";
            }

            const currentLabels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });

            for (const label of currentLabels) {
              const name = label.name ?? "";
              if (!sizeLabels.includes(name)) {
                continue;
              }
              if (name === targetSizeLabel) {
                continue;
              }
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                name,
              });
            }

            await addLabelsWithinCap({
              github,
              core,
              owner: context.repo.owner,
              repo: context.repo.repo,
              issueNumber: pullRequest.number,
              labels: [targetSizeLabel],
            });
      - name: Apply maintainer or trusted-contributor label
        if: ${{ github.event.action != 'edited' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const login = context.payload.pull_request?.user?.login;
            if (!login) {
              return;
            }

            const repo = `${context.repo.owner}/${context.repo.repo}`;
            // const trustedLabel = "trusted-contributor";
            // const experiencedLabel = "experienced-contributor";
            // const trustedThreshold = 4;
            // const experiencedThreshold = 10;

            let isMaintainer = false;
            try {
              const membership = await github.rest.teams.getMembershipForUserInOrg({
                org: context.repo.owner,
                team_slug: "maintainer",
                username: login,
              });
              isMaintainer = membership?.data?.state === "active";
            } catch (error) {
              if (error?.status !== 404) {
                throw error;
              }
            }

            if (isMaintainer) {
              const { pathToFileURL } = require("node:url");
              const { addLabelsWithinCap } = await import(
                pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/automation/labeler-label-cap.mjs`).href
              );
              await addLabelsWithinCap({
                github,
                core,
                owner: context.repo.owner,
                repo: context.repo.repo,
                issueNumber: context.payload.pull_request.number,
                labels: ["maintainer"],
              });
              return;
            }

            // trusted-contributor and experienced-contributor labels disabled.
            // const mergedQuery = `repo:${repo} is:pr is:merged author:${login}`;
            // let mergedCount = 0;
            // try {
            //   const merged = await github.rest.search.issuesAndPullRequests({
            //     q: mergedQuery,
            //     per_page: 1,
            //   });
            //   mergedCount = merged?.data?.total_count ?? 0;
            // } catch (error) {
            //   if (error?.status !== 422) {
            //     throw error;
            //   }
            //   core.warning(`Skipping merged search for ${login}; treating as 0.`);
            // }
            //
            // if (mergedCount >= experiencedThreshold) {
            //   await github.rest.issues.addLabels({
            //     ...context.repo,
            //     issue_number: context.payload.pull_request.number,
            //     labels: [experiencedLabel],
            //   });
            //   return;
            // }
            //
            // if (mergedCount >= trustedThreshold) {
            //   await github.rest.issues.addLabels({
            //     ...context.repo,
            //     issue_number: context.payload.pull_request.number,
            //     labels: [trustedLabel],
            //   });
            // }
      - name: Apply beta-blocker title label
        if: ${{ github.event.action != 'edited' || github.event.changes.title }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const pullRequest = context.payload.pull_request;
            if (!pullRequest) {
              return;
            }

            const labelName = "beta-blocker";
            const matchesBetaBlocker = /\bbeta blocker\b/i.test(pullRequest.title ?? "");

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
              });
            } catch (error) {
              if (error?.status !== 404) {
                throw error;
              }
              core.info(`Skipping ${labelName} labeling because the label does not exist in the repository.`);
              return;
            }

            const currentLabels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });
            const hasLabel = currentLabels.some((label) => label.name === labelName);

            if (matchesBetaBlocker && !hasLabel) {
              const { pathToFileURL } = require("node:url");
              const { addLabelsWithinCap } = await import(
                pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/automation/labeler-label-cap.mjs`).href
              );
              await addLabelsWithinCap({
                github,
                core,
                owner: context.repo.owner,
                repo: context.repo.repo,
                issueNumber: pullRequest.number,
                labels: [labelName],
              });
              return;
            }

            if (!matchesBetaBlocker && hasLabel) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                name: labelName,
              });
            }

  backfill-pr-labels:
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: labeler-${{ github.repository }}-${{ github.ref || github.run_id }}
      cancel-in-progress: false
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          app-id: ${{ vars.BARNACLE_APP_ID }}
          private-key: ${{ secrets.BARNACLE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: write
          permission-members: read
          permission-metadata: read
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Backfill PR labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoFull = `${owner}/${repo}`;
            const inputs = { max_prs: process.env.LABELER_MAX_PRS, per_page: process.env.LABELER_PER_PAGE };
            const maxPrsInput = inputs.max_prs ?? "200";
            const perPageInput = inputs.per_page ?? "50";
            const parsedMaxPrs = Number.parseInt(maxPrsInput, 10);
            const parsedPerPage = Number.parseInt(perPageInput, 10);
            const maxPrs = Number.isFinite(parsedMaxPrs) ? parsedMaxPrs : 200;
            const perPage = Number.isFinite(parsedPerPage) ? Math.min(100, Math.max(1, parsedPerPage)) : 50;
            const processAll = maxPrs <= 0;
            const maxCount = processAll ? Number.POSITIVE_INFINITY : Math.max(1, maxPrs);

            const { pathToFileURL } = require("node:url");
            const { addLabelsWithinCap } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/automation/labeler-label-cap.mjs`).href
            );

            const sizeLabels = ["size: XS", "size: S", "size: M", "size: L", "size: XL"];
            const betaBlockerLabel = "beta-blocker";
            const labelColor = "b76e79";
            // const trustedLabel = "trusted-contributor";
            // const experiencedLabel = "experienced-contributor";
            // const trustedThreshold = 4;
            // const experiencedThreshold = 10;

            const contributorCache = new Map();

            async function ensureSizeLabels() {
              for (const label of sizeLabels) {
                try {
                  await github.rest.issues.getLabel({
                    owner,
                    repo,
                    name: label,
                  });
                } catch (error) {
                  if (error?.status !== 404) {
                    throw error;
                  }
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: label,
                    color: labelColor,
                  });
                }
              }
            }

            async function hasBetaBlockerLabel() {
              try {
                await github.rest.issues.getLabel({
                  owner,
                  repo,
                  name: betaBlockerLabel,
                });
                return true;
              } catch (error) {
                if (error?.status !== 404) {
                  throw error;
                }
                return false;
              }
            }

            async function resolveContributorLabel(login) {
              if (contributorCache.has(login)) {
                return contributorCache.get(login);
              }

              let isMaintainer = false;
              try {
                const membership = await github.rest.teams.getMembershipForUserInOrg({
                  org: owner,
                  team_slug: "maintainer",
                  username: login,
                });
                isMaintainer = membership?.data?.state === "active";
              } catch (error) {
                if (error?.status !== 404) {
                  throw error;
                }
              }

              if (isMaintainer) {
                contributorCache.set(login, "maintainer");
                return "maintainer";
              }

              // trusted-contributor and experienced-contributor labels disabled.
              // const mergedQuery = `repo:${repoFull} is:pr is:merged author:${login}`;
              // let mergedCount = 0;
              // try {
              //   const merged = await github.rest.search.issuesAndPullRequests({
              //     q: mergedQuery,
              //     per_page: 1,
              //   });
              //   mergedCount = merged?.data?.total_count ?? 0;
              // } catch (error) {
              //   if (error?.status !== 422) {
              //     throw error;
              //   }
              //   core.warning(`Skipping merged search for ${login}; treating as 0.`);
              // }

              const label = null;
              // if (mergedCount >= experiencedThreshold) {
              //   label = experiencedLabel;
              // } else if (mergedCount >= trustedThreshold) {
              //   label = trustedLabel;
              // }

              contributorCache.set(login, label);
              return label;
            }

            async function applySizeLabel(pullRequest, currentLabels, labelNames) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pullRequest.number,
                per_page: 100,
              });

              const excludedLockfiles = new Set(["package-lock.json", "client/package-lock.json", "e2e/package-lock.json", "pnpm-lock.yaml", "yarn.lock", "bun.lockb"]);
              const totalChangedLines = files.reduce((total, file) => {
                const path = file.filename ?? "";
                if (path.startsWith("docs/") || excludedLockfiles.has(path)) {
                  return total;
                }
                return total + (file.additions ?? 0) + (file.deletions ?? 0);
              }, 0);

              let targetSizeLabel = "size: XL";
              if (totalChangedLines < 50) {
                targetSizeLabel = "size: XS";
              } else if (totalChangedLines < 200) {
                targetSizeLabel = "size: S";
              } else if (totalChangedLines < 500) {
                targetSizeLabel = "size: M";
              } else if (totalChangedLines < 1000) {
                targetSizeLabel = "size: L";
              }

              for (const label of currentLabels) {
                const name = label.name ?? "";
                if (!sizeLabels.includes(name)) {
                  continue;
                }
                if (name === targetSizeLabel) {
                  continue;
                }
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: pullRequest.number,
                  name,
                });
                labelNames.delete(name);
              }

              if (!labelNames.has(targetSizeLabel)) {
                const added = await addLabelsWithinCap({
                  github,
                  core,
                  owner,
                  repo,
                  issueNumber: pullRequest.number,
                  labels: [targetSizeLabel],
                });
                if (added) {
                  labelNames.add(targetSizeLabel);
                }
              }
            }

            async function applyContributorLabel(pullRequest, labelNames) {
              const login = pullRequest.user?.login;
              if (!login) {
                return;
              }

              const label = await resolveContributorLabel(login);
              if (!label) {
                return;
              }

              if (labelNames.has(label)) {
                return;
              }

              const added = await addLabelsWithinCap({
                github,
                core,
                owner,
                repo,
                issueNumber: pullRequest.number,
                labels: [label],
              });
              if (added) {
                labelNames.add(label);
              }
            }

            async function applyBetaBlockerTitleLabel(pullRequest, labelNames) {
              const matchesBetaBlocker = /\bbeta blocker\b/i.test(pullRequest.title ?? "");

              if (matchesBetaBlocker) {
                if (!labelNames.has(betaBlockerLabel)) {
                  const added = await addLabelsWithinCap({
                    github,
                    core,
                    owner,
                    repo,
                    issueNumber: pullRequest.number,
                    labels: [betaBlockerLabel],
                  });
                  if (added) {
                    labelNames.add(betaBlockerLabel);
                  }
                }
                return;
              }

              if (!labelNames.has(betaBlockerLabel)) {
                return;
              }

              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: pullRequest.number,
                name: betaBlockerLabel,
              });
              labelNames.delete(betaBlockerLabel);
            }

            await ensureSizeLabels();
            const betaBlockerLabelExists = await hasBetaBlockerLabel();

            let page = 1;
            let processed = 0;

            while (processed < maxCount) {
              // Keep GitHub pagination offsets stable; the inner loop enforces maxCount.
              const pageSize = perPage;
              const { data: pullRequests } = await github.rest.pulls.list({
                owner,
                repo,
                state: "open",
                per_page: pageSize,
                page,
              });

              if (pullRequests.length === 0) {
                break;
              }

              for (const pullRequest of pullRequests) {
                if (!processAll && processed >= maxCount) {
                  break;
                }

                const currentLabels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
                  owner,
                  repo,
                  issue_number: pullRequest.number,
                  per_page: 100,
                });

                const labelNames = new Set(
                  currentLabels.map((label) => label.name).filter((name) => typeof name === "string"),
                );

                await applySizeLabel(pullRequest, currentLabels, labelNames);
                await applyContributorLabel(pullRequest, labelNames);
                if (betaBlockerLabelExists) {
                  await applyBetaBlockerTitleLabel(pullRequest, labelNames);
                }

                processed += 1;
              }

              if (pullRequests.length < pageSize) {
                break;
              }

              page += 1;
            }

            core.info(`Processed ${processed} pull requests.`);

  label-issues:
    if: >-
      ${{ (github.event_name == 'issues' &&
        (github.event.action != 'edited' || !github.event.changes || github.event.changes.title)) }}
    concurrency:
      group: labeler-${{ github.repository }}-issue-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          app-id: ${{ vars.BARNACLE_APP_ID }}
          private-key: ${{ secrets.BARNACLE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: write
          permission-members: read
          permission-metadata: read
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Apply maintainer or trusted-contributor label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const login = context.payload.issue?.user?.login;
            if (!login) {
              return;
            }

            const repo = `${context.repo.owner}/${context.repo.repo}`;
            // const trustedLabel = "trusted-contributor";
            // const experiencedLabel = "experienced-contributor";
            // const trustedThreshold = 4;
            // const experiencedThreshold = 10;

            let isMaintainer = false;
            try {
              const membership = await github.rest.teams.getMembershipForUserInOrg({
                org: context.repo.owner,
                team_slug: "maintainer",
                username: login,
              });
              isMaintainer = membership?.data?.state === "active";
            } catch (error) {
              if (error?.status !== 404) {
                throw error;
              }
            }

            if (isMaintainer) {
              const { pathToFileURL } = require("node:url");
              const { addLabelsWithinCap } = await import(
                pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/automation/labeler-label-cap.mjs`).href
              );
              await addLabelsWithinCap({
                github,
                core,
                owner: context.repo.owner,
                repo: context.repo.repo,
                issueNumber: context.payload.issue.number,
                labels: ["maintainer"],
              });
              return;
            }

            // trusted-contributor and experienced-contributor labels disabled.
            // const mergedQuery = `repo:${repo} is:pr is:merged author:${login}`;
            // let mergedCount = 0;
            // try {
            //   const merged = await github.rest.search.issuesAndPullRequests({
            //     q: mergedQuery,
            //     per_page: 1,
            //   });
            //   mergedCount = merged?.data?.total_count ?? 0;
            // } catch (error) {
            //   if (error?.status !== 422) {
            //     throw error;
            //   }
            //   core.warning(`Skipping merged search for ${login}; treating as 0.`);
            // }
            //
            // if (mergedCount >= experiencedThreshold) {
            //   await github.rest.issues.addLabels({
            //     ...context.repo,
            //     issue_number: context.payload.issue.number,
            //     labels: [experiencedLabel],
            //   });
            //   return;
            // }
            //
            // if (mergedCount >= trustedThreshold) {
            //   await github.rest.issues.addLabels({
            //     ...context.repo,
            //     issue_number: context.payload.issue.number,
            //     labels: [trustedLabel],
            //   });
            // }
      - name: Apply beta-blocker title label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const issue = context.payload.issue;
            if (!issue || issue.pull_request) {
              return;
            }

            const labelName = "beta-blocker";
            const matchesBetaBlocker = /^beta blocker:/i.test(issue.title ?? "");

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
              });
            } catch (error) {
              if (error?.status !== 404) {
                throw error;
              }
              core.info(`Skipping ${labelName} labeling because the label does not exist in the repository.`);
              return;
            }

            const currentLabels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });
            const hasLabel = currentLabels.some((label) => label.name === labelName);

            if (matchesBetaBlocker && !hasLabel) {
              const { pathToFileURL } = require("node:url");
              const { addLabelsWithinCap } = await import(
                pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/automation/labeler-label-cap.mjs`).href
              );
              await addLabelsWithinCap({
                github,
                core,
                owner: context.repo.owner,
                repo: context.repo.repo,
                issueNumber: issue.number,
                labels: [labelName],
              });
              return;
            }

            if (!matchesBetaBlocker && hasLabel) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: labelName,
              });
            }
