name: PR context

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  context:
    runs-on: ubuntu-latest
    if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') }}
    steps:
      # Pinned to a full commit SHA rather than a floating tag such as @v4.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read pull request body
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq .body > "$RUNNER_TEMP/pr-body.md"

      - name: Require problem, impact, why, and evidence
        run: python3 .github/scripts/pr-context-check.py "$RUNNER_TEMP/pr-body.md"
