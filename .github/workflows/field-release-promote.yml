name: Field Release Promote
run-name: Point its channel at field ${{ inputs.tag }}

# Points a channel at a published release (docs/RELEASING.md), after it
# verifies the release as published: the manifest's checksum, the npm
# integrity, registry signatures and provenance, and the image's GitHub
# attestation by digest.
#
#   stable tag  npm `latest`, GHCR `stable` and `latest`, GitHub's latest
#               release; `beta` moves up too when the beta channel is behind
#   beta tag    npm `beta` and GHCR `beta`
#
# A release already lands on its channel when it is published, so this is for
# rolling a channel back to an earlier release, or putting one back.
#
# npm's trusted publisher for this file (environment npm-release) has
# "Allow npm dist-tag" on and does not publish.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, for example v2026.10.15 or v2026.10.15-beta.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: field-release-promote
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  NPM_VERSION: "11.21.0"
  PACKAGE: "@arcforgelabs/field"
  IMAGE: ghcr.io/arcforgelabs/field

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Read the image's attestations even while the package is private.
      packages: read
    outputs:
      version: ${{ steps.manifest.outputs.version }}
      channel: ${{ steps.manifest.outputs.channel }}
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Require the workflow from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run Field Release Promote from main, not ${GITHUB_REF}." >&2
          exit 1

      - name: Read and check the release manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v20[0-9]{2}\.[1-9][0-9]?\.[1-9][0-9]?(-beta\.[1-9][0-9]*)?$ ]]; then
            echo "::error::${TAG} is not a release tag (vYYYY.M.D or vYYYY.M.D-beta.N)." >&2
            exit 1
          fi
          cd "$RUNNER_TEMP"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'release-manifest.json*'
          sha256sum -c release-manifest.json.sha256
          jq -e --arg tag "$TAG" '.tag == $tag' release-manifest.json >/dev/null
          {
            echo "version=$(jq -r .version release-manifest.json)"
            echo "channel=$(jq -r .channel release-manifest.json)"
            echo "digest=$(jq -r .image.digest release-manifest.json)"
            echo "integrity=$(jq -r .npm.integrity release-manifest.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm ${{ env.NPM_VERSION }}
        run: npm install -g "npm@${NPM_VERSION}"

      - name: Verify the npm package
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
          INTEGRITY: ${{ steps.manifest.outputs.integrity }}
        run: |
          set -euo pipefail
          served="$(npm view "${PACKAGE}@${VERSION}" dist.integrity)"
          if [[ "$served" != "$INTEGRITY" ]]; then
            echo "::error::npm serves ${served} for ${PACKAGE}@${VERSION}; the manifest says ${INTEGRITY}." >&2
            exit 1
          fi
          npm view "${PACKAGE}@${VERSION}" dist.attestations.provenance.predicateType | grep -qx 'https://slsa.dev/provenance/v1'
          work="$(mktemp -d)"
          cd "$work"
          npm init -y >/dev/null
          npm install --omit=dev --ignore-scripts --no-audit --no-fund "${PACKAGE}@${VERSION}" >/dev/null
          npm audit signatures

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify the image attestation by digest
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$GITHUB_REPOSITORY"

  promote:
    name: promote
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm-release
      url: https://github.com/arcforgelabs/field/releases/tag/${{ inputs.tag }}
    permissions:
      contents: write
      packages: write
      # npm dist-tag through trusted publishing (npm 11.21.0 or later, with
      # "Allow npm dist-tag" on this workflow's trusted publisher).
      id-token: write
    steps:
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm ${{ env.NPM_VERSION }}
        run: npm install -g "npm@${NPM_VERSION}"

      - name: Move the npm dist-tags
        id: npm
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == "beta" ]]; then
            npm dist-tag add "${PACKAGE}@${VERSION}" beta
            npm view "$PACKAGE" dist-tags --json | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm dist-tag add "${PACKAGE}@${VERSION}" latest
          # Beta users are never behind stable: when `beta` is this release's
          # own pre-release or an older one, it moves up to this release.
          beta="$(npm view "$PACKAGE" dist-tags.beta 2>/dev/null || true)"
          beta_base="${beta%%-*}"
          lowest="$(printf '%s\n%s\n' "$beta_base" "$VERSION" | sort -V | head -n1)"
          if [[ -z "$beta" || "$lowest" == "$beta_base" ]]; then
            npm dist-tag add "${PACKAGE}@${VERSION}" beta
            echo "beta=true" >> "$GITHUB_OUTPUT"
          fi
          npm view "$PACKAGE" dist-tags --json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Move the GHCR channel tags to the verified digest
        env:
          DIGEST: ${{ needs.verify.outputs.digest }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
          MOVE_BETA: ${{ steps.npm.outputs.beta }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == "beta" ]]; then
            tags=(--tag "${IMAGE}:beta")
          else
            tags=(--tag "${IMAGE}:stable" --tag "${IMAGE}:latest")
            [[ "$MOVE_BETA" == "true" ]] && tags+=(--tag "${IMAGE}:beta")
          fi
          docker buildx imagetools create "${tags[@]}" "${IMAGE}@${DIGEST}"
          echo "${tags[*]} -> ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Mark the GitHub Release as latest
        if: needs.verify.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
