name: Field Release Checks

# Proves a release tag before anything is published (docs/RELEASING.md):
# the tag is annotated and signed, and GitHub verifies its signature; it is a
# calendar version that matches package.json; it sits on its release branch
# (release/YYYY.M.N); every CI lane passes on its exact commit
# (.github/workflows/ci.yml, which also writes the SBOMs); and the npm
# tarball installs and starts. Field Release Publish calls this first; run it on its own to
# rehearse a release. It never publishes.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, for example v2026.10.15-beta.1
        required: true
        type: string
    outputs:
      branch:
        value: ${{ jobs.resolve.outputs.branch }}
      commit:
        value: ${{ jobs.resolve.outputs.commit }}
      version:
        value: ${{ jobs.resolve.outputs.version }}
      channel:
        value: ${{ jobs.resolve.outputs.channel }}
      npm_dist_tag:
        value: ${{ jobs.resolve.outputs.npm_dist_tag }}
      tarball:
        value: ${{ jobs.package.outputs.tarball }}
      tarball_sha256:
        value: ${{ jobs.package.outputs.tarball_sha256 }}
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v2026.10.15-beta.1
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "24.22.1"

jobs:
  resolve:
    name: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      branch: ${{ steps.tag.outputs.branch }}
      version: ${{ steps.tag.outputs.version }}
      channel: ${{ steps.tag.outputs.channel }}
      npm_dist_tag: ${{ steps.tag.outputs.npm_dist_tag }}
    steps:
      # openclaw/openclaw verifies the tag's signature before it checks out
      # anything: an annotated tag that GitHub reports as verified. Field
      # requires the signature only when RELEASE_REQUIRE_SIGNED_TAGS is true
      # (docs/RELEASING.md, One-time setup); until then an annotated tag is
      # enough, so a release never stops on signing. A lightweight tag is
      # never published.
      - name: Require an annotated release tag
        id: signed
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_SIGNED: ${{ vars.RELEASE_REQUIRE_SIGNED_TAGS }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          if [[ "$(jq -r .object.type <<< "$ref")" != "tag" ]]; then
            echo "::error::${TAG} must be an annotated tag; a lightweight tag cannot be published." >&2
            exit 1
          fi
          object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$(jq -r .object.sha <<< "$ref")")"
          verified="$(jq -r '.verification.verified // false' <<< "$object")"
          if [[ "$verified" != "true" && "$REQUIRE_SIGNED" == "true" ]]; then
            echo "::error::${TAG} must have a signature GitHub verifies (reason: $(jq -r '.verification.reason // "missing"' <<< "$object"))." >&2
            exit 1
          fi
          if [[ "$(jq -r .object.type <<< "$object")" != "commit" ]]; then
            echo "::error::${TAG} does not name a commit." >&2
            exit 1
          fi
          echo "commit=$(jq -r .object.sha <<< "$object")" >> "$GITHUB_OUTPUT"
          echo "${TAG}: annotated by $(jq -r .tagger.name <<< "$object"); signature verified by GitHub: ${verified}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Require the release branch and a matching version
        id: tag
        env:
          TAG: ${{ inputs.tag }}
          SIGNED: ${{ steps.signed.outputs.commit }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if [[ "$commit" != "$SIGNED" ]]; then
            echo "::error::${TAG} changed after its signature was verified: expected ${SIGNED}, found ${commit}." >&2
            exit 1
          fi
          node scripts/release/release.mjs check --tag "$TAG" > "$RUNNER_TEMP/release.json"
          branch="$(jq -r .branch "$RUNNER_TEMP/release.json")"
          if ! git fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" \
            || ! git merge-base --is-ancestor "$commit" "refs/remotes/origin/${branch}"; then
            echo "::error::${TAG} (${commit}) is not on ${branch}. Only release-branch commits are released." >&2
            exit 1
          fi
          {
            echo "commit=${commit}"
            echo "branch=${branch}"
            echo "version=$(jq -r .version "$RUNNER_TEMP/release.json")"
            echo "channel=$(jq -r .channel "$RUNNER_TEMP/release.json")"
            echo "npm_dist_tag=$(jq -r .npmDistTag "$RUNNER_TEMP/release.json")"
          } | tee -a "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: ci
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}
      tag: ${{ inputs.tag }}

  package:
    name: package
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      tarball_sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      # The tag, not a commit passed between jobs: the build runs only what
      # resolve proved is on its release branch. A tag moved since then fails here.
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Require the commit resolve proved
        env:
          RESOLVED: ${{ needs.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$RESOLVED" ]; then
            echo "::error::The tag now points at ${head}, not the ${RESOLVED} that resolve proved is on its release branch. Run the release again." >&2
            exit 1
          fi

      # No Actions cache: what is published is built from the registry and
      # the lockfiles alone, and a release run never writes a cache that
      # main's later runs would read.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build the data layer and the client bundle
        run: |
          set -euo pipefail
          npm ci
          npm run db:build
          npm --prefix client ci
          npm --prefix client run build

      # A beta's version is package.json's version with -beta.N, and a
      # correction's with -C; npm version
      # writes it to package.json and package-lock.json in this job only.
      # The shrinkwrap pins every installed dependency to what CI tested.
      - name: Pack the npm tarball
        id: pack
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          cp package-lock.json npm-shrinkwrap.json
          mkdir -p "$RUNNER_TEMP/package"
          tarball="$(npm pack --pack-destination "$RUNNER_TEMP/package" --json | jq -r '.[0].filename')"
          (cd "$RUNNER_TEMP/package" && sha256sum "$tarball" > "$tarball.sha256")
          node scripts/release/release.mjs migrations --output "$RUNNER_TEMP/package/migrations.json"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "$RUNNER_TEMP/package/$tarball.sha256")" >> "$GITHUB_OUTPUT"
          echo "Packed ${tarball}: $(cat "$RUNNER_TEMP/package/$tarball.sha256")" >> "$GITHUB_STEP_SUMMARY"

      - name: Install the tarball in an empty directory and start it
        run: scripts/release/package-smoke.sh "$RUNNER_TEMP/package/${{ steps.pack.outputs.tarball }}"

      - name: Keep the tarball for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/package
          retention-days: 30
          if-no-files-found: error
