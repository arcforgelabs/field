# Area labels for pull requests, applied by .github/workflows/labeler.yml
# (actions/labeler v7 syntax). The workflow reads this file from the base
# branch only, so a pull request cannot change how it is itself labelled.
"area: quotes":
  - changed-files:
      - any-glob-to-any-file:
          - server/quotes/**
          - server/quote-*.js
          - server/generate-evidence-quote*.js
          - server/legacy-sent-quote{,.test}.js
          - server/job-actions{,.test}.js
          - server/pipeline{,.test}.js
          - server/clarification-notes{,.test}.js
          - server/evidence-index{,.test}.js
          - server/ingestion-ledger{,.test}.js
          - server/reconcile-baseline-scope{,.test}.js
          - shared/money.*
          - shared/source-label-disambiguation.*
          - scripts/export-quote-proof-bundle{,.test}.js
          - server/local-pricing{,.test}.js
          - server/assembly-modes{,.test}.js
          - server/retaining-wall-*.js
          - server/wall-*.js
          - shared/quote-*
          - shared/retaining-wall-render.*
          - client/src/features/job/**
          - client/src/features/job-detail/**
          - generate-landscaping-quote.js
          - scripts/quote-invoice-proof/**

