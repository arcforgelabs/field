# Area labels for pull requests, applied by .github/workflows/labeler.yml
# (actions/labeler v7 syntax). The workflow reads this file from the base
# branch only, so a pull request cannot change how it is itself labelled.
"area: quotes":
  - changed-files:
      - any-glob-to-any-file:
          - server/quotes/**
          - server/quote-*.js
          - server/generate-evidence-quote.js
          - server/legacy-sent-quote.js
          - server/local-pricing.js
          - server/assembly-modes.js
          - server/retaining-wall-*.js
          - server/wall-*.js
          - shared/quote-*.js
          - shared/retaining-wall-render.js
          - client/src/features/job/**
          - client/src/features/job-detail/**
          - generate-landscaping-quote.js
          - scripts/quote-invoice-proof/**

"area: invoices":
  - changed-files:
      - any-glob-to-any-file:
          - server/invoices/**
          - server/invoice-*.js
          - client/src/features/invoices/**
          - scripts/quote-invoice-proof/**

"area: documents":
  - changed-files:
      - any-glob-to-any-file:
          - server/documents/**
          - server/storage/**
          - server/job-documents.js
          - server/job-document-context.js
          - server/sent-email-archive.js

"area: catalogue":
