          - server/db/**
          - server/db-runtime/**
          - server/data-migrations/**

"area: auth":
  - changed-files:
      - any-glob-to-any-file:
          - server/auth/**
          - client/src/features/login/**

"area: integrations":
  - changed-files:
      - any-glob-to-any-file:
          - server/xero/**
          - server/mcp/**
          - server/gmail-oauth-store.js
          - server/email-*.js
          - server/send-quote-email.js
          - server/scheduled-email-queue.js
          - server/google-*.js
          - server/drive-upload.js
          - docs/XERO.md
          - docs/REMOTE_MCP.md
          - docs/GMAIL_SENDING.md

"area: client":
  - changed-files:
      - any-glob-to-any-file:
