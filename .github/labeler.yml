      - any-glob-to-any-file:
          - Dockerfile
          - .dockerignore
          - .replit
          - scripts/replit-*
          - docs/REPLIT.md

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - .github/**

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - "*.md"

"area: dependencies":
  - changed-files:
      - any-glob-to-any-file:
          - package.json
          - package-lock.json
          - client/package.json
          - client/package-lock.json
